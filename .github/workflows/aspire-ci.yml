name: .NET Aspire CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node 20 + pnpm (via Corepack)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Enable Corepack
        run: corepack enable

      - name: Restore .NET solution
        run: dotnet restore KunstButikken-asp.sln

      - name: Build .NET solution
        run: dotnet build --no-restore -c Release KunstButikken-asp.sln

      - name: Install frontend deps (pnpm)
        working-directory: KunstButikken.Frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests with coverage (Jest)
        working-directory: KunstButikken.Frontend
        run: pnpm run test:coverage

      - name: Collect frontend coverage
        shell: bash
        run: |
          mkdir -p coverage/frontend/jest
          rsync -a KunstButikken.Frontend/coverage/jest/ coverage/frontend/jest/ || true

      - name: Upload frontend coverage (Jest)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-jest
          path: coverage/frontend/jest/

  aspire-e2e:
    name: Aspire E2E (in-process AppHost)
    runs-on: ubuntu-latest
    # Allow this job to be optional; it will still run but tests can self-skip if Docker isn't available
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Ensure Docker is available
        run: |
          docker --version
          docker info
