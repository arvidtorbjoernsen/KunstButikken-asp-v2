<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <title>KunstButikken</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1f2937">
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('kb-theme');
        if (!mode) {
          mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = mode;
        document.documentElement.lang = localStorage.getItem('kb-locale') || 'nb';
      } catch (_) {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.lang = 'nb';
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
